name: Test & Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # .NET 10 is the runtime the site and tests target; the .NET 11 SDK
          # supplies C# 15, which the union example needs.
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Run unit tests
        run: dotnet test --configuration Release

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # .NET 10 is the runtime the site and tests target; the .NET 11 SDK
          # supplies C# 15, which the union example needs.
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Publish Blazor WebAssembly site
        run: dotnet publish src/QuickResult.Web -c Release -o publish

      # Render every page to static HTML (plus 404.html and sitemap.xml) so search
      # engines and link previews see real content without running WebAssembly.
      - name: Prerender pages
        run: dotnet run --project src/QuickResult.Web.Prerender -c Release -- publish/wwwroot

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy publish/wwwroot --project-name=quickresult

      # IndexNow: tell Bing and the other participating search engines which pages
      # exist as soon as a deploy lands. The key is public by design; it is proved
      # by the matching 06c5b7a97c8bed9610e8d7a306634d4c.txt file served from the site root.
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        env:
          INDEXNOW_KEY: 06c5b7a97c8bed9610e8d7a306634d4c
        run: |
          grep -o '<loc>[^<]*</loc>' publish/wwwroot/sitemap.xml \
            | sed -e 's/<loc>//' -e 's/<\/loc>//' \
            | jq -R . \
            | jq -s --arg key "$INDEXNOW_KEY" \
                '{host: "quickresult.net", key: $key, keyLocation: "https://quickresult.net/\($key).txt", urlList: .}' \
            > indexnow.json
          cat indexnow.json
          curl -sS -o /dev/null -w "IndexNow responded %{http_code}\n" \
            -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" \
            --data @indexnow.json
